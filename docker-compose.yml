version: '3.8'

services:
  ai_engine:
    build:
      context: .
      dockerfile: ai_engine/Dockerfile
    container_name: memoryverse_ai_engine
    ports:
      - "8001:8001"
    env_file:
      - ./backend/.env
    environment:
      - PORT=8001
      - PYTHONUNBUFFERED=1
    volumes:
      - ./ai_engine:/app/ai_engine
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - memoryverse_net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: memoryverse_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - AI_ENGINE_URL=http://ai_engine:8001
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend/app:/app/backend/app
      - ./backend/storage:/app/backend/storage
      - ./ai_engine:/app/ai_engine
    depends_on:
      ai_engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - memoryverse_net

networks:
  memoryverse_net:
    driver: bridge
