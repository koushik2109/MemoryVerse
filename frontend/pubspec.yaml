name: frontend
description: "MemoryVerse — Capture life's story, one verse at a time."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # ── UI ──────────────────────────────────────────────────────────────────────
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.0
  flutter_screenutil: ^5.9.3
  flutter_animate: ^4.5.2

  # ── State & Navigation ────────────────────────────────────────────────────────
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0

  # ── Networking ────────────────────────────────────────────────────────────────
  dio: ^5.11.0

  # ── Backend / Auth ────────────────────────────────────────────────────────────
  supabase_flutter: ^2.8.4
  flutter_dotenv: ^5.2.1
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # Env file (loaded at runtime — never commit actual .env to git)
    - .env
    # App icons (only dirs that actually contain files)
    - assets/icons/
